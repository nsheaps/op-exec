name: check

on:
  push:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout and authenticate as GitHub App
        id: auth
        uses: nsheaps/github-actions/.github/actions/checkout-as-app@603052841cd49b9fdc99bc32979ff9c45c9b669e # checkout-as-app@main
        with:
          app-id: ${{ secrets.AUTOMATION_GITHUB_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_GITHUB_APP_PRIVATE_KEY }}
          ref: ${{ github.head_ref || github.ref }}

      - name: Setup mise
        uses: jdx/mise-action@v4

      - name: Find bash scripts
        id: find-bash
        run: |
          bash_files=""
          # bin/ scripts without .sh extension
          for f in $(find ./bin -maxdepth 1 -type f -not -name '*.sh' -not -path './.git/*'); do
            shebang=$(head -1 "$f")
            if echo "$shebang" | grep -qE '(bash|^#!/bin/sh)'; then
              bash_files="$bash_files $f"
            fi
          done
          echo "files=$bash_files" >> "$GITHUB_OUTPUT"
          echo "Found bash files:$bash_files"

      - name: ShellCheck
        if: steps.find-bash.outputs.files != ''
        run: |
          bash_files="${{ steps.find-bash.outputs.files }}"
          echo "Running ShellCheck on:$bash_files"
          shellcheck $bash_files

      - name: shfmt -w
        if: steps.find-bash.outputs.files != ''
        run: |
          bash_files="${{ steps.find-bash.outputs.files }}"
          echo "Running shfmt on:$bash_files"
          # -w writes formatting fixes in place; indent settings sourced from .editorconfig
          shfmt -w $bash_files

      - name: EditorConfig check
        uses: editorconfig-checker/action-editorconfig-checker@main

      - name: Run editorconfig-checker
        run: editorconfig-checker

      - name: Commit and push shfmt fixes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: `shfmt -w`"
          commit_user_name: ${{ steps.auth.outputs.user-name }}
          commit_user_email: ${{ steps.auth.outputs.user-email }}
